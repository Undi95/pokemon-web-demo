<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Pokemon Web Demo</title>
  <link rel="icon" href="data:,">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #1a1a1a;
      color: #eee;
      font-family: monospace;
      min-height: 100vh;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 0;
    }
    #game canvas {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    .topbar {
      padding: 8px;
      font-size: 12px;
      color: #888;
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .topbar a { color: #88f; }
    .topbar button {
      background: #333; color: #eee; border: 1px solid #555;
      font-family: monospace; font-size: 12px; padding: 2px 8px; cursor: pointer;
    }
    .topbar button:hover { background: #444; }
  </style>
</head>
<body>
  <div class="topbar">
    <span>Z/Q/S/D ou flèches : déplacer &nbsp;|&nbsp; W : parler &nbsp;|&nbsp; B : menu</span>
    <span>Zoom :</span>
    <button onclick="setGameZoom(1)" title="1:1 résolution native GBA (240×160)">×1</button>
    <button onclick="setGameZoom(2)">×2</button>
    <button onclick="setGameZoom(3)">×3</button>
    <button onclick="setGameZoom(4)">×4</button>
    <button onclick="setGameZoom(5)">×5</button>
    <button onclick="setGameZoom(6)">×6</button>
    <button onclick="openRemapModal()" title="Personnaliser les touches">🎮 Remap</button>
  </div>
  <div id="game"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
