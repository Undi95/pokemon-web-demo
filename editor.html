<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Map Editor</title>
  <style>
    body {
      margin: 0;
      padding: 16px;
      background: #1a1a1a;
      color: #eee;
      font-family: monospace;
      display: flex;
      gap: 20px;
    }
    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 220px;
    }
    .palette {
      display: grid;
      grid-template-columns: repeat(4, 32px);
      gap: 4px;
    }
    .tile {
      width: 32px;
      height: 32px;
      cursor: pointer;
      border: 2px solid transparent;
    }
    .tile.selected {
      border-color: #ff0;
    }
    canvas {
      image-rendering: pixelated;
      background: #000;
      cursor: crosshair;
    }
    button {
      background: #333;
      color: #eee;
      border: 1px solid #555;
      padding: 6px 12px;
      cursor: pointer;
      font-family: monospace;
    }
    button:hover { background: #444; }
    pre {
      background: #000;
      padding: 8px;
      max-height: 200px;
      overflow: auto;
      font-size: 11px;
    }
    a { color: #88f; }
    h2 { margin: 0 0 8px 0; font-size: 14px; }
    label { font-size: 12px; }
  </style>
</head>
<body>
  <div class="sidebar">
    <h2>Palette</h2>
    <div id="palette" class="palette"></div>
    <h2>Outils</h2>
    <label><input type="checkbox" id="collisionMode"> Mode collision (clic = toggle)</label>
    <button id="loadBtn">Charger route1.json</button>
    <button id="exportBtn">Exporter JSON</button>
    <button id="downloadBtn">Télécharger .json</button>
    <button id="clearBtn">Vider</button>
    <p><a href="/">← retour au jeu</a></p>
    <h2>Sortie</h2>
    <pre id="output">(rien)</pre>
  </div>
  <div>
    <h2>Map (clic = peindre, clic droit = supprimer)</h2>
    <canvas id="grid" width="640" height="480"></canvas>
  </div>
  <script type="module" src="/src/editor/editor.ts"></script>
</body>
</html>
